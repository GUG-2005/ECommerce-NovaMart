name: CD - Deploy NovaMart to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate production code
    uses: ./.github/workflows/validate.yml

  deploy:
    name: Publish website
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: "github-pages"
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage only public website assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/css public/js public/shared
          cp index.html public/index.html
          cp css/style.css public/css/style.css
          cp js/app.js public/js/app.js
          cp shared/firebase-config.js public/shared/firebase-config.js
          touch public/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
